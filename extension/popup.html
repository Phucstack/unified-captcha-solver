<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unified CAPTCHA Solver</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; background: #0f172a; color: #e2e8f0; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #38bdf8; }
    label { display: block; font-size: 12px; margin-top: 7px; color: #94a3b8; }
    input, select, textarea { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 5px 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 8px; font-size: 12px; }
    .row { display: flex; align-items: center; gap: 6px; }
    .row input { width: auto; margin: 0; }
    button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
    button.secondary { background: #334155; margin-top: 6px; }
    button.mini { margin-top: 5px; padding: 5px; font-size: 11px; background: #1e3a5f; }
    #status { margin-top: 8px; font-size: 12px; color: #a7f3d0; word-break: break-word; }
  </style>
</head>
<body>
  <h2>Unified CAPTCHA Solver v1.2</h2>
  <label>API Endpoint
    <input id="apiBaseUrl" type="text" placeholder="http://127.0.0.1:8000" />
  </label>
  <div class="grid2">
    <label>Text Mode
      <select id="mode">
        <option value="hybrid">Hybrid (ONNX->AI)</option>
        <option value="local_cnn">Local ONNX Only</option>
        <option value="vision_ai">Vision AI Only</option>
      </select>
    </label>
    <label>Vision AI
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="gemini">Gemini</option>
      </select>
    </label>
  </div>
  <div class="grid2">
    <label>Audio Solver
      <select id="audioProvider">
        <option value="whisper_local">Whisper Local</option>
        <option value="openai">OpenAI Audio</option>
        <option value="gemini">Gemini Audio</option>
      </select>
    </label>
    <label>Solve Delay (ms)
      <input id="solveDelayMs" type="number" min="0" step="100" value="600" />
    </label>
  </div>
  <div class="checks">
    <label class="row"><input id="autoSolve" type="checkbox" /><span>Auto-solve</span></label>
    <label class="row"><input id="evalMath" type="checkbox" /><span>Math mode</span></label>
    <label class="row"><input id="enableText" type="checkbox" /><span>Text/Image</span></label>
    <label class="row"><input id="enableRecaptcha" type="checkbox" /><span>reCAPTCHA</span></label>
    <label class="row"><input id="enableHcaptcha" type="checkbox" /><span>hCaptcha</span></label>
    <label class="row"><input id="enableAwsCaptcha" type="checkbox" /><span>AWS WAF</span></label>
    <label class="row"><input id="enableFuncaptcha" type="checkbox" /><span>FunCaptcha</span></label>
  </div>
  <div class="grid2">
    <label>Custom Img Selector
      <input id="textImageSelector" type="text" placeholder="img#captcha" />
      <button id="pickImgBtn" class="mini" type="button">Pick Img</button>
    </label>
    <label>Custom Input Selector
      <input id="textInputSelector" type="text" placeholder="input#code" />
      <button id="pickInputBtn" class="mini" type="button">Pick Input</button>
    </label>
  </div>
  <label>Disabled Hosts
    <textarea id="disabledHosts" rows="2" placeholder="example.com"></textarea>
  </label>
  <button id="saveBtn">Save Settings</button>
  <button id="healthBtn" class="secondary">Test Server Health</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
